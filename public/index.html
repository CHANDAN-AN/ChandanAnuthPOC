<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Products</title>

    <style>
        /* Provides basic styling for the product table. */
        table {
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>Food Products</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody id="foodTable">
        </tbody>
    </table>

    <script>
        // Gets the food products from the backend and displays them in the table.
        fetch("/foods")
            .then(response => response.json())
            .then(foods => {
                const foodTable = document.getElementById("foodTable");

                foods.forEach(food => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${food.id}</td>
                        <td>${food.name}</td>
                        <td>$${food.price.toFixed(2)}</td>
                    `;

                    foodTable.appendChild(row);
                });
            })
            .catch(error => {
                console.log("Error loading foods:", error);
            });
    </script>

</body>
</html>
